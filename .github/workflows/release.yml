name: Build & Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - release
          - test
        default: 'test'
      tag:
        description: 'Tag name (required for release, e.g. v2.04)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Build MiniDebug APK
      run: ./gradlew assembleMiniDebug

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: outputs-apk-release
        path: app/build/outputs/apk/release
        if-no-files-found: error
        retention-days: 30

    - name: Upload MiniDebug APK
      uses: actions/upload-artifact@v4
      with:
        name: outputs-apk-minidebug
        path: app/build/outputs/apk/miniDebug
        if-no-files-found: error
        retention-days: 30

  release:
    needs: build
    if: github.event.inputs.type == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout with full history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate categorized changelog
      id: changelog
      run: |
        TAG="${{ github.event.inputs.tag }}"
        if [ -z "$TAG" ]; then
          echo "tag is required for release" && exit 1
        fi

        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          COMMIT_RANGE="$LAST_TAG..HEAD"
        else
          COMMIT_RANGE="HEAD~20..HEAD"
        fi

        # Get commits with conventional format
        git log --no-merges --pretty=format:"%s (%h)" $COMMIT_RANGE > /tmp/commits.txt

        # Categorize commits
        FEATURES=$(grep -E "^(feat|feature)(\(.*\))?:" /tmp/commits.txt | sed 's/^/- /' || echo "")
        FIXES=$(grep -E "^(fix|bug)(\(.*\))?:" /tmp/commits.txt | sed 's/^/- /' || echo "")
        IMPROVEMENTS=$(grep -E "^(improve|perf|refactor|style)(\(.*\))?:" /tmp/commits.txt | sed 's/^/- /' || echo "")
        CHORES=$(grep -E "^(chore|build|ci|docs|test)(\(.*\))?:" /tmp/commits.txt | sed 's/^/- /' || echo "")
        OTHERS=$(grep -vE "^(feat|feature|fix|bug|improve|perf|refactor|style|chore|build|ci|docs|test)(\(.*\))?:" /tmp/commits.txt | sed 's/^/- /' || echo "")

        cat << 'EOF' > /tmp/changelog.md
## DSU Sideloader ${{ github.event.inputs.tag }}

EOF

        [ -n "$FEATURES" ] && echo -e "### ✨ Features\n$FEATURES\n" >> /tmp/changelog.md
        [ -n "$FIXES" ] && echo -e "### 🐛 Bug Fixes\n$FIXES\n" >> /tmp/changelog.md
        [ -n "$IMPROVEMENTS" ] && echo -e "### ⚡ Improvements\n$IMPROVEMENTS\n" >> /tmp/changelog.md
        [ -n "$CHORES" ] && echo -e "### 🔧 Chores\n$CHORES\n" >> /tmp/changelog.md
        [ -n "$OTHERS" ] && echo -e "### 📝 Other Changes\n$OTHERS\n" >> /tmp/changelog.md

        echo -e "\n---\n\n### Build\n- Gradle 8.13\n- AGP 8.13.2\n- Kotlin 2.2.20\n- Compose 1.11.4" >> /tmp/changelog.md

        cat /tmp/changelog.md
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat /tmp/changelog.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: outputs-apk-release
        path: release-apk

    - name: Download MiniDebug APK
      uses: actions/download-artifact@v4
      with:
        name: outputs-apk-minidebug
        path: minidebug-apk

    - name: Rename APKs
      run: |
        mv release-apk/*.apk release-apk/app-release.apk 2>/dev/null || true
        mv minidebug-apk/*.apk minidebug-apk/app-minidebug.apk 2>/dev/null || true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag }}
        name: DSU Sideloader ${{ github.event.inputs.tag }}
        body: ${{ steps.changelog.outputs.changelog }}
        files: |
          release-apk/app-release.apk
          minidebug-apk/app-minidebug.apk
        draft: false
        prerelease: false