name: Build & Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - release
          - test
        default: 'test'
      tag:
        description: 'Tag name (required for release, e.g. v2.04)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Build MiniDebug APK
      run: ./gradlew assembleMiniDebug

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: outputs-apk-release
        path: app/build/outputs/apk/release
        if-no-files-found: error
        retention-days: 30

    - name: Upload MiniDebug APK
      uses: actions/upload-artifact@v4
      with:
        name: outputs-apk-minidebug
        path: app/build/outputs/apk/miniDebug
        if-no-files-found: error
        retention-days: 30

  release:
    needs: build
    if: github.event.inputs.type == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Read changelog
      id: changelog
      run: |
        CHANGELOG_FILE="other/module_updater/latest_changelog.md"
        if [ -f "$CHANGELOG_FILE" ]; then
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat "$CHANGELOG_FILE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "changelog=No changelog found" >> $GITHUB_OUTPUT
        fi

    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: outputs-apk-release
        path: release-apk

    - name: Download MiniDebug APK
      uses: actions/download-artifact@v4
      with:
        name: outputs-apk-minidebug
        path: minidebug-apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag }}
        name: DSU Sideloader ${{ github.event.inputs.tag }}
        body: |
          ## DSU Sideloader ${{ github.event.inputs.tag }}
          
          ${{ steps.changelog.outputs.changelog }}
          
          ---
          
          ### Build
          - Gradle 8.13
          - AGP 8.13.2
          - Kotlin 2.2.20
          - Compose 1.11.4
        files: |
          release-apk/*.apk
          minidebug-apk/*.apk
        draft: false
        prerelease: false