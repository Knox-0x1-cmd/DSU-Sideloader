name: Build & Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - release
          - test
        default: 'test'
      tag:
        description: 'Tag name (required for release, e.g. v2.04)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Build MiniDebug APK
      run: ./gradlew assembleMiniDebug

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: outputs-apk-release
        path: app/build/outputs/apk/release
        if-no-files-found: error
        retention-days: 30

    - name: Upload MiniDebug APK
      uses: actions/upload-artifact@v4
      with:
        name: outputs-apk-minidebug
        path: app/build/outputs/apk/miniDebug
        if-no-files-found: error
        retention-days: 30

  release:
    needs: build
    if: github.event.inputs.type == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout with full history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get recent successful commits
      id: commits
      run: |
        TAG="${{ github.event.inputs.tag }}"
        # Get commits since last tag (or last 20 commits if no previous tag)
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          COMMITS=$(git log --oneline --no-merges $LAST_TAG..HEAD)
        else
          COMMITS=$(git log --oneline --no-merges -20)
        fi
        echo "commits<<EOF" >> $GITHUB_OUTPUT
        echo "$COMMITS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: outputs-apk-release
        path: release-apk

    - name: Download MiniDebug APK
      uses: actions/download-artifact@v4
      with:
        name: outputs-apk-minidebug
        path: minidebug-apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag }}
        name: DSU Sideloader ${{ github.event.inputs.tag }}
        body: |
          ## DSU Sideloader ${{ github.event.inputs.tag }}

          ### Changes
          ${{ steps.commits.outputs.commits }}

          ---

          ### Build
          - Gradle 8.13
          - AGP 8.13.2
          - Kotlin 2.2.20
          - Compose 1.11.4
        files: |
          release-apk/*.apk
          minidebug-apk/*.apk
        draft: false
        prerelease: false