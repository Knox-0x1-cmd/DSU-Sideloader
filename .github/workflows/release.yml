name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Build MiniDebug APK
      run: ./gradlew assembleMiniDebug

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: outputs-apk-release
        path: app/build/outputs/apk/release
        if-no-files-found: error
        retention-days: 30

    - name: Upload MiniDebug APK
      uses: actions/upload-artifact@v4
      with:
        name: outputs-apk-minidebug
        path: app/build/outputs/apk/miniDebug
        if-no-files-found: error
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: outputs-apk-release
        path: release-apk

    - name: Download MiniDebug APK
      uses: actions/download-artifact@v4
      with:
        name: outputs-apk-minidebug
        path: minidebug-apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: DSU Sideloader ${{ github.ref_name }}
        body: |
          ## DSU Sideloader ${{ github.ref_name }}

          ### Changes
          - New icon applied to all mipmap densities
          - Custom theme colors: #151713, #2B2E29, #718268, #E6E2DA
          - Dynamic color (Material You) disabled by default
          - Fixed night theme secondary color
          - Removed v31 color overrides
          - ProGuard rules for Hilt, AboutLibraries, Serialization, Shizuku, LibSu
          - Fixed adaptive icon (removed mipmap background PNGs)
          - Fixed ic_launcher_round.xml background reference
          - Dynamic color (Material You) disabled by default

          ### Build
          - Gradle 8.13
          - AGP 8.13.2
          - Kotlin 2.2.20
          - Compose 1.11.4

        files: |
          release-apk/*.apk
          minidebug-apk/*.apk
        draft: false
        prerelease: false