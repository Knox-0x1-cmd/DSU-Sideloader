name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.9)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release
        if-no-files-found: error
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout with full history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate changelog from last 4 commits
      id: changelog
      shell: bash
      run: |
        git log --no-merges --pretty=format:"- %s (%h)" -4 HEAD > /tmp/changelog.md
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat /tmp/changelog.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: app-release
        path: release-apk

    - name: Rename APK
      run: |
        set -e
        RELEASE_APK=$(find release-apk -name "*.apk" | head -1)
        [ -n "$RELEASE_APK" ] && mv "$RELEASE_APK" release-apk/app-release.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: DSU Sideloader ${{ github.event.inputs.version }}
        body: ${{ steps.changelog.outputs.changelog }}
        files: release-apk/app-release.apk
        draft: false
        prerelease: false

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build MiniDebug (test)
      run: ./gradlew assembleMiniDebug

    - name: Upload Test Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-minidebug-test
        path: app/build/outputs/apk/miniDebug
        if-no-files-found: error
        retention-days: 7