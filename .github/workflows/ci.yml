name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - minidebug

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        build_type: [release, minidebug]
        include:
          - build_type: release
            gradle_task: assembleRelease
            artifact_name: app-release
            artifact_path: app/build/outputs/apk/release
            retention_days: 30
          - build_type: minidebug
            gradle_task: assembleMiniDebug
            artifact_name: app-minidebug
            artifact_path: app/build/outputs/apk/miniDebug
            retention_days: 7

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: ./gradlew ${{ matrix.gradle_task }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
        retention-days: ${{ matrix.retention_days }}

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout with full history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate changelog
      id: changelog
      shell: bash
      run: |
        TAG="${{ github.ref_name }}"
        # Get last 4 commits (excluding merges) as the changelog
        git log --no-merges --pretty=format:"- %s (%h)" -4 HEAD > /tmp/changelog.md

        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat /tmp/changelog.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: app-release
        path: release-apk

    - name: Download MiniDebug APK
      uses: actions/download-artifact@v4
      with:
        name: app-minidebug
        path: minidebug-apk

    - name: Rename APKs
      run: |
        set -e
        RELEASE_APK=$(find release-apk -name "*.apk" | head -1)
        MINIDEBUG_APK=$(find minidebug-apk -name "*.apk" | head -1)
        [ -n "$RELEASE_APK" ] && mv "$RELEASE_APK" release-apk/app-release.apk
        [ -n "$MINIDEBUG_APK" ] && mv "$MINIDEBUG_APK" minidebug-apk/app-minidebug.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: DSU Sideloader ${{ github.ref_name }}
        body: ${{ steps.changelog.outputs.changelog }}
        files: |
          release-apk/app-release.apk
          minidebug-apk/app-minidebug.apk
        draft: false
        prerelease: false